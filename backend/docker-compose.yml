version: "3.9"

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iris
      POSTGRES_PASSWORD: iris_secret
      POSTGRES_DB: iris_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iris -d iris_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://iris:iris_secret@db:5432/iris_db
      LOG_LEVEL: INFO
      # Add your secrets below (or use a .env file)
      # HELIUS_API_KEY: your_key_here
      # OPENAI_API_KEY: your_key_here
    env_file:
      - .env
    volumes:
      # Hot-reload in dev: mount source so you don't need to rebuild
      - .:/app
    command: >
      sh -c "prisma db push --schema=schema.prisma &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
